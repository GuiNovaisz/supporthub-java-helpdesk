name: Backend CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit and PostgreSQL integration tests
        run: ./mvnw -B -ntp clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/*.xml
            target/failsafe-reports/*.xml
          retention-days: 14

  container:
    name: Container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image and smoke-test a fresh Compose stack
        shell: bash
        run: |
          export DB_PASSWORD="$(openssl rand -hex 20)"
          export ADMIN_EMAIL=admin@example.test
          export ADMIN_PASSWORD="$(openssl rand -hex 20)"
          docker compose -p supporthub-ci up --build --wait --wait-timeout 180
          pwsh -NoProfile -File scripts/smoke.ps1
      - name: Show logs on failure
        if: failure()
        env:
          DB_PASSWORD: unused-for-log-inspection
        run: docker compose -p supporthub-ci logs --no-color
      - name: Remove job resources
        if: always()
        env:
          DB_PASSWORD: unused-for-cleanup
        run: docker compose -p supporthub-ci down --volumes

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
