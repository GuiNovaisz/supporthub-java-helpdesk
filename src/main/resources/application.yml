spring:
  application:
    name: supporthub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supporthub}
    username: ${DB_USER:supporthub}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    clean-disabled: true

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true

info:
  app:
    name: SupportHub
    milestone: Full Stack Experience

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

supporthub:
  bootstrap:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
