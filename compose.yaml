services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-supporthub}
      POSTGRES_USER: ${DB_USER:-supporthub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or the environment}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-supporthub}
      DB_USER: ${DB_USER:-supporthub}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or the environment}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}

volumes:
  db-data:
